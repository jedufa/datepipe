name: Privacy check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test privacy checks with synthetic fixtures
        run: python3 -m unittest discover -s tools -p test_privacy_check.py
      - name: Scan tracked files and reachable history
        run: python3 tools/privacy_check.py
